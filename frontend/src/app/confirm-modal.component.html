<div
  class="modal-overlay"
  role="presentation"
  (click)="closeFromBackdrop($event)"
>
  <section
    class="confirm-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-modal-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-indicator" [class.danger]="variant() === 'danger'" aria-hidden="true">
      <span></span>
    </div>
    <h2 id="confirm-modal-title">{{ title() }}</h2>
    <p class="modal-message">{{ message() }}</p>
    @if (secondaryText()) {
      <p class="modal-secondary">{{ secondaryText() }}</p>
    }
    @if (errorMessage()) {
      <p class="modal-error" role="alert">{{ errorMessage() }}</p>
    }
    <div class="modal-actions">
      <button
        type="button"
        class="cancel-button"
        [disabled]="loading()"
        (click)="cancel.emit()"
      >
        Cancelar
      </button>
      <button
        type="button"
        class="confirm-button"
        [class.danger]="variant() === 'danger'"
        [disabled]="loading()"
        (click)="confirm.emit()"
      >
        @if (loading()) {
          {{ confirmText() }}...
        } @else {
          {{ confirmText() }}
        }
      </button>
    </div>
  </section>
</div>
